# ChatMood API — Fly.io deployment (Docker).
# Pair with any hosted Postgres (docs/DATABASE-OPTIONS.md) + R2 for durable files.
app = "moodai-api"
primary_region = "jnb"          # Johannesburg — closest to 🇬🇭 Accra

[build]
  dockerfile = "Dockerfile.fly"

[env]
  # uploads/media on the machine's ephemeral disk UNTIL R2 is wired (docs/R2-STORAGE.md).
  # (A moodai_data volume was created but dropped: jnb zones were capacity-saturated at
  #  deploy time; R2 is the designed durable store, so we skip volume babysitting.)
  UPLOAD_DIR = "/data/storage"
  MEDIA_DIR = "/data/media"
  # 🖼️ Free daily image generation with zero API key: Pollinations FLUX.
  # xAI (grok-2-image) stays primary; any failure — e.g. $0 team credits —
  # auto-falls back to the free engine instead of erroring to the user.
  # More free engines can be chained left→right here once their keys exist, e.g.
  #   "gemini,pollinations"          (GEMINI_API_KEY already set • free daily quota)
  #   "huggingface,pollinations"     (HF_API_TOKEN • free daily credits)
  #   "cloudflare,pollinations"      (WORKERS_AI_* / CLOUDFLARE_* • 10k neurons/day)
  IMAGE_FALLBACK_PROVIDER = "pollinations"


[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: renders/edits can exceed 60s — machines must not sleep mid-job.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    # boot runs alembic first, then uvicorn — and the first /readyz pings a
    # possibly-cold Neon compute (wake-ups measured at 4-15s). 40s/10s left no
    # headroom and could fail a deploy whose machine was perfectly healthy.
    grace_period = "60s"
    method = "GET"
    # Readiness, not liveness: /healthz returns 200 as long as the process is up,
    # so a machine with a dead Postgres kept serving 500s while its check stayed
    # green. /readyz pings the DB and 503s when it is unreachable.
    # Only READINESS_REQUIRED deps (default: postgres) can 503 — Redis/Qdrant are
    # NOT provisioned on Fly and are optional by design, so they report
    # "degraded" at 200 instead of failing every machine's health check.
    path = "/readyz"
    timeout = "15s"        # DB probe on a waking Neon compute can take 4-15s (measured)

[vm]
  memory = "1gb"           # ffmpeg pays its rent here; 512mb works for chat-only
  cpu_kind = "shared"
  cpus = 1
